# Multi-Arch Cloud Build pipeline for Supreme Harness

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["buildx", "create", "--name", "supreme-builder", "--use"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "buildx"
      - "build"
      - "--platform"
      - "linux/amd64,linux/arm64"
      - "--build-arg"
      - "BASE_IMAGE=${_REGISTRY}/scion-base:${_TAG}"
      - "-t"
      - "${_REGISTRY}/scion-supreme:${_TAG}"
      - "-t"
      - "${_REGISTRY}/scion-supreme:${_SHORT_SHA}"
      - "-f"
      - "Dockerfile"
      - "."
      - "--push"

substitutions:
  _REGISTRY: "us-central1-docker.pkg.dev/scion-builds/scion"
  _TAG: "latest"
